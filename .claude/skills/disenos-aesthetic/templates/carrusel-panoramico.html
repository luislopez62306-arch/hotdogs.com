<!doctype html><html><head><meta charset="utf-8">
<!-- Plantilla: carrusel panorámico de 6 slides (6480×1350).
     Render: node scripts/render.js este.html salida 1080 1350 6 -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@400;500&family=Pinyon+Script&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--fondo:#F3ECE6;--tinta:#5a1018;--acento:#a3314a;--suave:#e6c3c6}
*{margin:0;box-sizing:border-box}
body{width:6480px;height:1350px;position:relative;overflow:hidden;background:var(--fondo);color:var(--tinta);font-family:Jost}
.a{position:absolute}
.cap{font-weight:500;letter-spacing:.42em;font-size:18px;text-transform:uppercase}
.bod{font-family:'Bodoni Moda';line-height:.92;letter-spacing:-.015em}
.it{font-style:italic;color:var(--acento)}
.hand{font-family:Caveat;color:var(--acento);line-height:1.05}
.sh{filter:drop-shadow(0 28px 26px rgba(60,10,20,.32)) drop-shadow(0 5px 7px rgba(60,10,20,.22))}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:multiply;pointer-events:none}
</style></head><body>
<!-- Elemento conductor que cruza todas las slides -->
<svg class="a" style="left:0;top:0" width="6480" height="1350"><path d="M-20 1230 C 700 1230,900 1110,1500 1110 S 2600 1250,3300 1250 S 4400 1120,5000 1120 S 6000 1240,6600 1240" fill="none" stroke="#e6c3c6" stroke-width="3"/></svg>

<!-- Slide 1 (x 0–1080): portada -->
<div class="a cap" style="left:80px;top:74px;opacity:.6">01 / 06</div>
<div class="a cap" style="left:80px;top:300px;color:var(--acento)">ETIQUETA CORTA</div>
<div class="a bod" style="left:70px;top:350px;font-size:160px">titular</div>
<div class="a bod it" style="left:70px;top:500px;font-size:160px">en itálica</div>
<div class="a hand" style="left:80px;top:1000px;font-size:46px">desliza →</div>

<!-- Slides 2–6: suma 1080·(n−1) a "left".
     Pon objetos cruzando los cortes (x = 1080, 2160, 3240…) para invitar a deslizar. -->

<svg class="grain" width="6480" height="1350"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#nz)"/></svg>
</body></html>
