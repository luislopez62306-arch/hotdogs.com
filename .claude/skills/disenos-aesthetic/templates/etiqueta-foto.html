<!doctype html><html><head><meta charset="utf-8">
<!-- Plantilla: diseño impreso sobre la etiqueta/tarjeta en blanco de una foto (recetas R1/R2).
     1) Detecta la etiqueta (ver references/recetas.md) y llena left/top/width/height.
     2) Render: node scripts/render.js este.html salida 1080 1350 1 .s -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{display:flex;gap:30px;padding:30px;width:max-content}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background-size:cover}
.art{position:absolute;overflow:hidden;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(60,20,20,.08)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,250,240,.16),transparent 40%,rgba(40,10,10,.14));box-shadow:inset 0 0 18px rgba(40,10,10,.22)}
.tinta{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#5a1018;mix-blend-mode:multiply}
.grain{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.35;pointer-events:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="pg"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer></filter></svg>

<!-- Variante A: arte a color de la invitación sobre la etiqueta -->
<div class="s" style="background-image:url(FOTO.png)">
  <div class="art" style="left:330px;top:520px;width:420px;height:720px">
    <img src="ARTE.jpg">
    <svg class="grain" width="100%" height="100%"><rect width="100%" height="100%" filter="url(#pg)"/></svg>
  </div>
</div>

<!-- Variante B: texto en tinta (cierre / CTA) -->
<div class="s" style="background-image:url(FOTO.png)">
  <div class="tinta" style="left:360px;top:540px;width:360px;height:660px">
    <div style="font-family:'Pinyon Script';font-size:80px">Marca</div>
    <div style="font:400 14px 'Bodoni Moda';letter-spacing:.36em;margin-top:14px">SUBTÍTULO</div>
    <div style="font:400 44px 'Bodoni Moda';margin-top:40px">¿hacemos <i>la tuya?</i></div>
    <div style="font:400 13px 'Bodoni Moda';letter-spacing:.3em;margin-top:36px;border-top:1px solid #5a1018;border-bottom:1px solid #5a1018;padding:12px 8px">MÁNDANOS DM →</div>
  </div>
</div>
</body></html>
